[project]
name = "ai-data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salmane MOHADDAB", email = "salmanemohaddab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.17.1",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-data-agent = "ai_data_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
